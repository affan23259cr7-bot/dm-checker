<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>DM Checker — BHS</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:16px;max-width:960px;margin:0 auto}
h1{font-size:19px;margin:0 0 3px}.sub{color:#94a3b8;font-size:12px;margin-bottom:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:14px}
.ct{font-size:14px;font-weight:600;margin-bottom:9px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#2563eb;color:#fff;border:0;padding:10px 16px;border-radius:7px;cursor:pointer;font-size:14px;font-family:inherit}
button:active{opacity:.7}button.gray{background:#475569}button:disabled{opacity:.4}
textarea{width:100%;height:80px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:7px;padding:10px;font-family:Consolas,monospace;font-size:13px}
.status{font-size:12px;padding:8px 11px;border-radius:6px;margin-top:9px}
.ok{background:#064e3b;color:#6ee7b7}.warn{background:#78350f;color:#fcd34d}.err{background:#7f1d1d;color:#fca5a5}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#334155;padding:8px;text-align:left;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #334155;vertical-align:top}
.b{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.red{background:#7f1d1d;color:#fca5a5}.org{background:#7c2d12;color:#fdba74}.grn{background:#064e3b;color:#6ee7b7}
.wrap{max-height:58vh;overflow:auto;border-radius:7px}.mono{font-family:Consolas,monospace}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.stat div{font-size:12px;color:#94a3b8}.stat b{display:block;font-size:20px;color:#e2e8f0}
.hint{color:#64748b;font-size:11.5px;margin-top:6px;line-height:1.5}
a{color:#93c5fd}
</style>
</head>
<body>
<h1>🔧 DM Checker — ตรวจ DM ค้างจาก CMMS</h1>
<div class="sub">Import ไฟล์ Equipment History → ค้นด้วยการพิมพ์ / ถ่ายรูปป้าย / สแกนสด</div>

<div class="card">
  <div class="ct">1) ฐานข้อมูล CMMS</div>
  <div class="bar">
    <input type="file" id="f" accept=".xlsx,.xls,.csv" hidden>
    <button onclick="f.click()">📥 Import ไฟล์ CMMS</button>
    <button class="gray" onclick="clearDB()">🗑 ล้าง</button>
  </div>
  <div id="dbinfo" class="hint"></div>
  <div id="freshness"></div>
  <div class="stat" id="stats"></div>
</div>

<div class="card">
  <div class="ct">2) 🎥 สแกนสด (จ่อป้าย อ่านอัตโนมัติ)</div>
  <div class="bar">
    <button id="btnScan" onclick="toggleScan()">▶️ เริ่มสแกน</button>
    <button class="gray" id="btnTorch" onclick="torch()" style="display:none">🔦 ไฟฉาย</button>
  </div>
  <div id="scanst" class="hint"></div>
  <div id="camwrap" style="display:none;position:relative;max-width:500px;margin-top:10px">
    <video id="cam" playsinline muted autoplay style="width:100%;border-radius:8px;background:#000;display:block"></video>
    <div style="position:absolute;left:8%;top:38%;width:84%;height:24%;border:2px solid #38bdf8;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.45);pointer-events:none"></div>
    <div id="live" style="position:absolute;left:0;right:0;bottom:5px;text-align:center;font-family:Consolas,monospace;font-size:14px;color:#7dd3fc;text-shadow:0 1px 3px #000"></div>
  </div>
  <div id="scanlist" style="margin-top:10px"></div>
</div>

<div class="card">
  <div class="ct">3) 📷 ค้นหาด้วยรูปป้าย</div>
  <div class="bar">
    <input type="file" id="img" accept="image/*" capture="environment" multiple hidden>
    <button onclick="img.click()">📸 ถ่ายรูป / เลือกรูป</button>
  </div>
  <div id="ocrst" class="hint"></div>
  <div id="ocrout" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"></div>
</div>

<div class="card">
  <div class="ct">4) ⌨️ พิมพ์ค้นหา</div>
  <textarea id="q" placeholder="LP252.BHT57_HM013&#10;LP252-BHT57-HS041"></textarea>
  <div class="bar" style="margin-top:8px">
    <button onclick="check()">ตรวจสอบ</button>
    <button class="gray" onclick="exportResult()">⬇ Export Excel</button>
  </div>
  <div class="hint">พิมพ์ได้ทั้ง <b>.</b> <b>_</b> <b>-</b> หรือเว้นวรรค ระบบแปลงให้เอง</div>
</div>

<div class="card"><div class="wrap"><table id="out"></table></div></div>

<script>
const KEY='cmms_dm_db';let DB=null,RESULT=[];
const norm=s=>String(s??'').toUpperCase().replace(/[\s\-_./]/g,'');
const H={pos:'ตำแหน่ง',sym:'สาเหตุ/อาการ',dt:'วันที่เสีย',lvl:'ระดับความเสียหาย',plan:'แผนการแก้ไข',doc:'Doc DM',wp:'WORK PERMIT',done:'วันแล้วเสร็จ',mc:'Machine type',cause:'สาเหตุการชำรุด',part:'อะไหล่'};

/* ---------- ดึงข้อมูลจาก Server กลาง (Google Sheets) อัตโนมัติ ---------- */
async function loadCentralDB() {
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/1X3yGiY54Agb3rywBF803bYhFgZEgLKUciy6ObwdbSlg/edit?usp=sharing'; // <-- ลิงก์ที่ได้จากการ Publish to web
  scanst.textContent = '⏳ กำลังอัปเดตฐานข้อมูลจาก Server กลาง...';
  
  try {
    const res = await fetch(CSV_URL);
    const data = await res.text();
    const rows = XLSX.utils.sheet_to_json(XLSX.read(data, {type:'string'}).Sheets.Sheet1);
    
    // กรองข้อมูล: ปิดแล้วไม่เอา
    const recs = rows.filter(r => !r['วันแล้วเสร็จ'] && r['ระดับความเสียหาย'] !== 'ปิด DM')
                     .map(r => ({ ...r, _n: norm(r['ตำแหน่ง']), pos: r['ตำแหน่ง'] }));
    
    DB = { at: Date.now(), recs };
    render();
    scanst.textContent = '✅ ข้อมูลเป็นปัจจุบัน (จาก Server กลาง)';
  } catch(e) { 
    scanst.textContent = '❌ ดึงข้อมูลพลาด กรุณาตรวจสอบลิงก์ CSV';
    console.error(e);
  }
}

// เปลี่ยนจากการกดปุ่ม ให้รันฟังก์ชันนี้ทันทีที่เปิดหน้าเว็บ
window.addEventListener('load', loadCentralDB);
