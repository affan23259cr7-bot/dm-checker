<stop offset="0" stop-color="#f2d574"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs>

<script>
/* ============ ฐานข้อมูลกลาง ============ */
const SHEET_ID='1X3yGiY54Agb3rywBF803bYhFgZEgLKUciy6ObwdbSlg';
const CSV_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv';
const KEY='cmms_dm_db_v3';let DB=null,RESULT=[],KEYS=[];
const norm=s=>String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H={pos:'ตำแหน่ง',sym:'สาเหตุ/อาการ',dt:'วันที่เสีย',lvl:'ระดับความเสียหาย',plan:'แผนการแก้ไข',doc:'Doc DM',wp:'WORK PERMIT',done:'วันแล้วเสร็จ',mc:'Machine type',cause:'สาเหตุการชำรุด',part:'อะไหล่'};

function lvlBadge(v){const t=String(v||'').trim();if(!t)return'<span class="b gry">-</span>';
  if(/ปิด/.test(t))return'<span class="b gry">'+esc(t)+'</span>';
  if(/1/.test(t))return'<span class="b red">'+esc(t)+'</span>';
  if(/2/.test(t))return'<span class="b org">'+esc(t)+'</span>';
  return'<span class="b pur">'+esc(t)+'</span>';}
function mcBadge(v){const t=String(v||'').trim();return t?'<span class="b blu">'+esc(t)+'</span>':'<span style="color:#475569">-</span>';}

/* ---------- parse: เก็บทุกแถว แยก open / history ---------- */
function parseWB(wb){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  let hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='ตำแหน่ง'));
  if(hi<0)throw new Error('ไม่พบคอลัมน์ "ตำแหน่ง"');
  const hd=rows[hi].map(c=>String(c).trim()),ix={};
  for(const k in H)ix[k]=hd.indexOf(H[k]);
  const recs=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];if(!row)continue;
    const pos=String(row[ix.pos]??'').trim();
    if(!pos||!/[A-Za-z]/.test(pos))continue;
    const o={};for(const k in H)o[k]=ix[k]>=0?String(row[ix[k]]??'').trim():'';
    o.pos=pos;o._n=norm(pos);
    o.open=!(o.done||/ปิด\s*DM/.test(o.lvl));
    recs.push(o);
  }
  return recs;
}
function buildIndex(){KEYS=[...new Set(DB.recs.map(r=>r._n))];}

async function loadCentralDB(){
  freshness.className='status warn';freshness.textContent='⏳ กำลังดึงข้อมูลจากฐานข้อมูลกลาง...';
  try{
    const res=await fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();
    if(txt.trim().startsWith('<'))throw new Error('ชีตยังไม่เปิดสิทธิ์ Anyone with the link');
    const recs=parseWB(XLSX.read(txt,{type:'string',raw:true}));
    if(!recs.length)throw new Error('ไม่พบข้อมูลในชีต');
    DB={at:Date.now(),recs,src:'ฐานข้อมูลกลาง'};
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    buildIndex();render();
  }catch(e){
    freshness.className='status err';
    freshness.innerHTML='❌ ดึงข้อมูลกลางไม่ได้: '+esc(e.message)+(DB?'<br>กำลังใช้ข้อมูลที่บันทึกไว้ครั้งก่อน':'');
    if(DB){buildIndex();renderStats();}
  }
}
f.onchange=e=>{const file=e.target.files[0];if(!file)return;
const r=new FileReader();r.onload=ev=>{try{
  const recs=parseWB(XLSX.read(ev.target.result,{type:'array'}));
  DB={at:Date.now(),recs,src:'ไฟล์ในเครื่อง'};
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(err){}
  buildIndex();render();alert('✅ นำเข้าสำเร็จ '+recs.length.toLocaleString()+' รายการ');
}catch(err){alert('❌ '+err.message)}};r.readAsArrayBuffer(file);f.value='';};

function render(){
  if(!DB){freshness.className='status warn';freshness.textContent='⚠️ ยังไม่มีข้อมูล';return;}
  const hrs=(Date.now()-DB.at)/36e5;
  freshness.className='status '+(hrs>24?'warn':'ok');
  freshness.textContent=(hrs>24?'⚠️ ข้อมูลเก่ากว่า '+Math.floor(hrs/24)+' วัน':'✅ ข้อมูลเป็นปัจจุบัน')+' — จาก'+DB.src;
  renderStats();
}
function renderStats(){
  const op=DB.recs.filter(r=>r.open);
  dbinfo.textContent='อัปเดต '+new Date(DB.at).toLocaleString('th-TH')+' • ทั้งหมด '+DB.recs.length.toLocaleString()+' รายการ (ค้าง '+op.length.toLocaleString()+')';
  const c={},ps=new Set(),mc=new Set();
  op.forEach(r=>{c[r.lvl||'-']=(c[r.lvl||'-']||0)+1;ps.add(r._n);if(r.mc)mc.add(r.mc)});
  stats.innerHTML='<div><b>'+op.length.toLocaleString()+'</b>DM ค้าง</div><div><b>'+ps.size.toLocaleString()+'</b>ตำแหน่ง</div><div><b>'+mc.size+'</b>Machine type</div>'
    +Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>'<div><b>'+v.toLocaleString()+'</b>'+esc(k)+'</div>').join('');
}

/* ---------- ตรวจสอบ ---------- */
const TH='<tr><th>ตำแหน่ง</th><th>สถานะ</th><th>Machine type</th><th>ระดับความเสียหาย</th><th>Doc DM</th><th>วันที่เสีย</th><th>ค้าง</th><th>อาการ</th><th>สาเหตุ</th><th>แผน</th><th>อะไหล่</th></tr>';
function findAll(code){const n=norm(code);return DB.recs.filter(r=>r._n===n);}
function check(){
  if(!DB){alert('ยังไม่มีข้อมูล กด "รีเฟรชข้อมูล" ก่อน');return;}
  const codes=q.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!codes.length){alert('กรุณาใส่รหัสตำแหน่ง');return;}
  RESULT=codes.map(code=>{const all=findAll(code);return{code,open:all.filter(r=>r.open),hist:all.filter(r=>!r.open)};});
  let h=TH;
  RESULT.forEach(({code,open,hist})=>{
    if(!open.length&&!hist.length){const n=nearest(code);
      h+='<tr><td class="mono">'+esc(code)+'</td><td><span class="b grn">🟢 ไม่พบข้อมูล</span></td><td colspan="9" style="color:#64748b">ไม่เคยมี DM ในระบบ'+(n?' • ใกล้เคียง: <a href="#" onclick="q.value=\''+n+'\';check();return false" class="mono">'+esc(n)+'</a>':'')+'</td></tr>';return;}
    const mcAll=[...new Set([...open,...hist].map(r=>r.mc).filter(Boolean))].join(', ');
    if(open.length){
      const bd=open.length>1?'<span class="b org">🟠 ค้าง '+open.length+' ใบ</span>':'<span class="b red">🔴 มี DM ค้าง</span>';
      open.forEach((r,i)=>{h+=row(i?'':esc(code),i?'':bd,r);});
    }else{
      h+='<tr><td class="mono">'+esc(code)+'</td><td><span class="b grn">🟢 ไม่มี DM ค้าง</span></td><td>'+mcBadge(mcAll)+'</td><td colspan="8" style="color:#8fa3bf">เคยมีประวัติ DM '+hist.length+' ครั้ง (ปิดแล้ว) — ดูรายละเอียดด้านล่าง</td></tr>';
    }
    hist.forEach(r=>{h+=row('','<span class="b gry">⚪ ประวัติ (ปิดแล้ว)</span>',r,1);});
  });
  out.innerHTML=h;
}
function row(c1,c2,r,dim){
  const st=dim?' style="opacity:.62"':'';
  return '<tr'+st+'><td class="mono">'+c1+'</td><td>'+c2+'</td><td>'+mcBadge(r.mc)+'</td><td>'+lvlBadge(r.lvl)+'</td><td class="mono">'+esc(r.doc)+'</td><td>'+esc(r.dt)+'</td><td>'+(dim?'-':age(r.dt))+'</td><td>'+esc(r.sym)+'</td><td>'+esc(r.cause)+'</td><td>'+esc(r.plan)+'</td><td>'+esc(r.part)+'</td></tr>';
}
function age(s){const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return'-';
  let y=+m[3];if(y>2400)y-=543;
  const d=Math.floor((Date.now()-new Date(y,+m[2]-1,+m[1]))/864e5);
  if(d<0||d>9000)return'-';
  return d>365?'<span style="color:#fca5a5">'+d+' วัน</span>':d+' วัน';}
function exportResult(){
  if(!RESULT.length){alert('ยังไม่มีผลลัพธ์');return;}
  const rows=[['ตำแหน่ง','สถานะ','Machine type','ระดับความเสียหาย','Doc DM','วันที่เสีย','ค้าง(วัน)','อาการ','สาเหตุการชำรุด','แผน','อะไหล่','Work Permit','วันแล้วเสร็จ']];
  RESULT.forEach(({code,open,hist})=>{
    if(!open.length&&!hist.length){rows.push([code,'ไม่พบข้อมูล','','','','','','','','','','','']);return;}
    open.forEach(r=>rows.push([code,'DM ค้าง',r.mc,r.lvl,r.doc,r.dt,age(r.dt).replace(/<[^>]+>/g,'').replace(' วัน',''),r.sym,r.cause,r.plan,r.part,r.wp,'']));
    hist.forEach(r=>rows.push([code,'ประวัติ (ปิดแล้ว)',r.mc,r.lvl,r.doc,r.dt,'',r.sym,r.cause,r.plan,r.part,r.wp,r.done]));
  });
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'DM Check');
  XLSX.writeFile(wb,'dm_check_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ============ OCR ============ */
const RX=/L\s*[P9R]\s*([0-9OQDILZSBGTA]{3})\s*[.\-_· ]{0,2}\s*([A-Z0-9]{3})\s*([0-9OQDILZSBGTA]{2})\s*[.\-_· ]{0,2}\s*([A-Z0-9]{2})\s*([0-9OQDILZSBGTA]{3})/gi;
const D={O:'0',Q:'0',D:'0',I:'1',L:'1','|':'1',Z:'2',S:'5',B:'8',G:'6',T:'7',A:'4'};
const L2={'0':'O','1':'I','5':'S','8':'B','2':'Z','6':'G','4':'A'};
const toD=s=>[...s.toUpperCase()].map(c=>D[c]??c).join('');
const toL=s=>[...s.toUpperCase()].map(c=>L2[c]??c).join('');
function grab(t){let m;RX.lastIndex=0;while((m=RX.exec(t)))return 'LP'+toD(m[1])+'-'+toL(m[2])+toD(m[3])+'-'+toL(m[4])+toD(m[5]);return null;}
function lev(a,b){if(Math.abs(a.length-b.length)>4)return 99;
  const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1],m[i][j-1],m[i-1][j])+1;return m[b.length][a.length];}
function nearest(code){if(!DB||!KEYS.length)return null;const t=norm(code);let best=null,bd=3;
  KEYS.forEach(k=>{const d=lev(k,t);if(d<bd){bd=d;best=k;}});
  return best?DB.recs.find(r=>r._n===best).pos:null;}
function bestFromText(raw){
  if(!DB||!KEYS.length)return null;
  const joined=norm(raw);if(joined.length<8)return null;
  const toks=String(raw).toUpperCase().split(/[^A-Z0-9]+/).map(norm).filter(t=>t.length>=4);
  const cands=[...toks];
  for(let i=0;i<toks.length-1;i++)cands.push(toks[i]+toks[i+1]);
  for(let i=0;i<toks.length-2;i++)cands.push(toks[i]+toks[i+1]+toks[i+2]);
  let best=null,bd=99;
  KEYS.forEach(k=>{
    const L=k.length;
    cands.forEach(t=>{const d=lev(k,t);if(d<bd){bd=d;best=k;}});
    for(let i=0;i+L<=joined.length&&i<200;i++){const d=lev(k,joined.substr(i,L));if(d<bd){bd=d;best=k;}}
  });
  if(best&&bd<=3)return{pos:DB.recs.find(r=>r._n===best).pos,dist:bd};
  return null;
}
/* ครอปเฉพาะป้ายสีน้ำเงินอัตโนมัติ */
function cropPlate(im){
  const W=Math.min(im.width,1000),sc=W/im.width,Hh=im.height*sc|0;
  const c=document.createElement('canvas');c.width=W;c.height=Hh;
  const x=c.getContext('2d');x.drawImage(im,0,0,W,Hh);
  const p=x.getImageData(0,0,W,Hh).data;
  let x0=W,y0=Hh,x1=0,y1=0,n=0;
  for(let y=0;y<Hh;y++)for(let xx=0;xx<W;xx++){
    const i=(y*W+xx)*4,r=p[i],g=p[i+1],b=p[i+2];
    if(b>70&&b>r+28&&b>g+12){n++;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  if(n<W*Hh*0.012||x1-x0<W*0.15)return null;
  const pad=8;
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W,x1+pad);y1=Math.min(Hh,y1+pad);
  const cw=x1-x0,ch=y1-y0;
  const o=document.createElement('canvas');o.width=cw;o.height=ch;
  o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
  return o;
}
function mkCanvas(src,w,h,mode){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data;let s=0;
  for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;s+=g;}
  const a=s/(p.length/4);
  for(let i=0;i<p.length;i+=4){
    let v=p[i];
    if(mode==='inv')v=255-v;
    else if(mode==='bin')v=v>a?255:0;
    else if(mode==='invbin')v=v>a+4?0:255;
    else if(mode==='hc')v=Math.max(0,Math.min(255,(v-a)*2.6+a));
    p[i]=p[i+1]=p[i+2]=v;
  }
  x.putImageData(d,0,0);return c;
}
async function runOCR(worker,src,modes,psms){
  let raw='',hit=null;
  for(const mode of modes){
    const tw=1500,th=Math.max(60,src.height*(tw/src.width)|0);
    const c=mkCanvas(src,tw,th,mode);
    for(const psm of psms){
      await worker.setParameters({tessedit_pageseg_mode:psm});
      const {data}=await worker.recognize(c);
      const t=data.text.replace(/\s+/g,' ').trim();
      if(t)raw+=' | '+t;
      const g=grab(t);if(g&&!hit)hit=g;
    }
    if(hit)break;
  }
  return{raw:raw.trim(),hit};
}
function loadImg(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const im=new Image();
  im.onload=()=>res({im,thumb:e.target.result});im.src=e.target.result;};r.readAsDataURL(file);});}
img.onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  if(!DB){alert('ยังไม่มีข้อมูล');img.value='';return;}
  ocrout.innerHTML='';ocrst.textContent='⏳ โหลดโมดูล OCR...';
  const w=await Tesseract.createWorker('eng');
  await w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_ '});
  for(let i=0;i<files.length;i++){
    ocrst.textContent='⏳ ประมวลผลรูป '+(i+1)+'/'+files.length+' ...';
    const {im,thumb}=await loadImg(files[i]);
    const plate=cropPlate(im);
    const src=plate||im;
    let {raw,hit}=await runOCR(w,src,['invbin','inv','hc','bin'],['7','6']);
    if(!hit&&plate){const r2=await runOCR(w,im,['invbin','hc'],['11','6']);raw+=' | '+r2.raw;hit=hit||r2.hit;}
    let code=hit,fz=null;
    if(!code){const b=bestFromText(raw);if(b){code=b.pos;fz=b.dist;}}
    const all=code?findAll(code):[];
    const open=all.filter(r=>r.open),hist=all.filter(r=>!r.open);
    const mcs=[...new Set(all.map(r=>r.mc).filter(Boolean))].join(', ');
    const lvls=[...new Set(open.map(r=>r.lvl).filter(Boolean))].join(', ');
    const near=code&&!all.length?nearest(code):null;
    ocrout.insertAdjacentHTML('beforeend',
      '<div style="width:235px;background:#0a1120;border:1px solid #2b3c57;border-radius:9px;padding:8px">'
      +'<img src="'+(plate?plate.toDataURL():thumb)+'" style="width:100%;height:100px;object-fit:contain;background:#000;border-radius:6px">'
      +(plate?'<div style="font-size:10px;color:#6ee7b7;margin-top:3px">✂️ ตัดเฉพาะป้ายอัตโนมัติ</div>':'<div style="font-size:10px;color:#fbbf24;margin-top:3px">⚠️ ไม่พบขอบป้ายสีน้ำเงิน</div>')
      +'<input class="mono" id="oc'+i+'" value="'+(code||'')+'" placeholder="พิมพ์รหัสเอง" style="width:100%;margin-top:7px;background:#16213a;color:#e7edf5;border:1px solid #2b3c57;border-radius:6px;padding:6px;font-size:12.5px">'
      +(fz!==null?'<div style="color:#fbbf24;font-size:10.5px;margin-top:4px">⚡ จับคู่ใกล้เคียง (ต่าง '+fz+' ตัว) — โปรดตรวจสอบ</div>':'')
      +'<div style="margin-top:6px">'+(!code?'<span class="b org">⚠️ อ่านไม่ออก</span>'
        :open.length?'<span class="b red">🔴 DM ค้าง '+open.length+' ใบ</span>'
        :hist.length?'<span class="b gry">⚪ มีประวัติ '+hist.length+' ครั้ง</span>':'<span class="b grn">🟢 ไม่พบ</span>')+'</div>'
      +(mcs?'<div style="margin-top:5px">'+mcBadge(mcs)+'</div>':'')
      +(lvls?'<div style="margin-top:4px">'+lvlBadge(lvls)+'</div>':'')
      +(near?'<div style="color:#fdba74;font-size:11px;margin-top:5px">ใกล้เคียง: <a href="#" onclick="document.getElementById(\'oc'+i+'\').value=\''+near+'\';return false">'+near+'</a></div>':'')
      +'<details><summary>🔎 ข้อความที่อ่านได้</summary><div class="rawbox">'+esc(raw||'(ว่าง)')+'</div></details>'
      +'</div></div>');
  }
  await w.terminate();
  ocrst.textContent='✅ เสร็จแล้ว — ตรวจรหัสให้ถูก แล้วกดปุ่มด้านล่าง';
  ocrout.insertAdjacentHTML('beforeend','<div style="width:100%"><button onclick="pushOCR('+files.length+')">➡️ ส่งไปตรวจสอบทั้งหมด</button></div>');
  img.value='';
};
function pushOCR(n){const a=[];for(let i=0;i<n;i++){const el=document.getElementById('oc'+i);if(el&&el.value.trim())a.push(el.value.trim());}
  if(!a.length){alert('ไม่มีรหัส');return;}q.value=a.join('\n');check();out.scrollIntoView({behavior:'smooth'});}

/* ---------- สแกนสด ---------- */
let SC={on:0,w:null,st:null,busy:0,seen:new Map(),track:null,torchOn:0,tid:null,flip:0};
async function toggleScan(){
  if(SC.on)return stopScan();
  if(!DB){alert('ยังไม่มีข้อมูล');return;}
  if(!navigator.mediaDevices?.getUserMedia){scanst.innerHTML='<span class="status err">❌ ต้องเปิดผ่าน HTTPS</span>';return;}
  scanst.textContent='⏳ เปิดกล้อง...';
  try{SC.st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});}
  catch(e){scanst.innerHTML='<span class="status err">❌ เปิดกล้องไม่ได้: '+esc(e.message)+'</span>';return;}
  cam.srcObject=SC.st;await cam.play();
  SC.track=SC.st.getVideoTracks()[0];
  if(SC.track.getCapabilities?.().torch)btnTorch.style.display='';
  camwrap.style.display='';btnScan.textContent='⏹ หยุด';SC.on=1;
  scanst.textContent='⏳ โหลดโมดูลอ่านตัวอักษร...';
  SC.w=await Tesseract.createWorker('eng');
  await SC.w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_ ',tessedit_pageseg_mode:'7'});
  scanst.textContent='🔍 จ่อให้ป้ายอยู่ในกรอบทอง';
  SC.tid=setInterval(tick,850);
}
function stopScan(){SC.on=0;clearInterval(SC.tid);SC.st?.getTracks().forEach(t=>t.stop());
  SC.w?.terminate();SC.w=null;SC.track=null;SC.torchOn=0;SC.seen.clear();
  camwrap.style.display='none';btnTorch.style.display='none';btnScan.textContent='▶️ เริ่มสแกน';scanst.textContent='หยุดแล้ว';live.textContent='';}
async function torch(){if(!SC.track)return;SC.torchOn=!SC.torchOn;
  try{await SC.track.applyConstraints({advanced:[{torch:!!SC.torchOn}]})}catch(e){}}
async function tick(){
  if(!SC.on||SC.busy||!SC.w||cam.readyState<2)return;SC.busy=1;
  try{
    const vw=cam.videoWidth,vh=cam.videoHeight;
    const sx=vw*.06,sy=vh*.36,sw=vw*.88,sh=vh*.28;
    const tmp=document.createElement('canvas');tmp.width=sw;tmp.height=sh;
    tmp.getContext('2d').drawImage(cam,sx,sy,sw,sh,0,0,sw,sh);
    const plate=cropPlate(tmp)||tmp;
    SC.flip=!SC.flip;
    const tw=1400,th=Math.max(50,plate.height*(tw/plate.width)|0);
    const c=mkCanvas(plate,tw,th,SC.flip?'invbin':'hc');
    const {data}=await SC.w.recognize(c);
    const txt=data.text.replace(/\s+/g,' ').trim();
    let code=grab(txt);
    if(!code&&norm(txt).length>=10){const b=bestFromText(txt);if(b&&b.dist<=2)code=b.pos;}
    live.textContent=code?'▸ '+code:(txt?'…'+txt.slice(-26):'');
    if(!code)return;
    const n=(SC.seen.get(code)||0)+1;SC.seen.set(code,n);
    if(n===2)confirmHit(code);
  }catch(e){}finally{SC.busy=0;}
}
function beep(hz,ms){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=hz;o.connect(g);g.connect(a.destination);g.gain.value=.12;o.start();
  setTimeout(()=>{o.stop();a.close()},ms);}catch(e){}}
function confirmHit(code){
  const all=findAll(code),open=all.filter(r=>r.open),hist=all.filter(r=>!r.open);
  if(open.length){beep(880,90);setTimeout(()=>beep(660,140),120);navigator.vibrate?.([90,60,90]);}
  else{beep(520,140);navigator.vibrate?.(70);}
  const near=all.length?null:nearest(code);
  const badge=open.length>1?'<span class="b org">🟠 ค้าง '+open.length+' ใบ</span>'
    :open.length?'<span class="b red">🔴 มี DM ค้าง</span>'
    :hist.length?'<span class="b gry">⚪ มีประวัติ '+hist.length+' ครั้ง</span>':'<span class="b grn">🟢 ไม่พบ</span>';
  const mcs=[...new Set(all.map(r=>r.mc).filter(Boolean))].join(', ');
  const detail=open.map(r=>'<div style="color:#cbd5e1;font-size:12px;margin-top:5px">• <span class="mono">'+esc(r.doc)+'</span> '+lvlBadge(r.lvl)+' '+esc(r.sym)+' <span style="color:#8fa3bf">(ค้าง '+age(r.dt).replace(/<[^>]+>/g,'')+')</span></div>').join('');
  scanlist.insertAdjacentHTML('afterbegin',
    '<div style="background:#0a1120;border:1px solid #2b3c57;border-left:4px solid '+(open.length?'#ef4444':hist.length?'#64748b':'#10b981')+';border-radius:9px;padding:10px;margin-bottom:8px">'
    +'<div class="bar"><span class="mono" style="font-size:14px">'+esc(code)+'</span>'+badge+(mcs?mcBadge(mcs):'')
    +'<span style="color:#64748b;font-size:11px;margin-left:auto">'+new Date().toLocaleTimeString('th-TH')+'</span></div>'
    +detail+(near?'<div style="color:#fdba74;font-size:11px;margin-top:5px">ไม่พบใน CMMS — ใกล้เคียง: '+esc(near)+'</div>':'')
    +'</div>');
  setTimeout(()=>SC.seen.delete(code),8000);
}
window.addEventListener('beforeunload',()=>{if(SC.on)stopScan()});
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
if(DB){buildIndex();render();}
loadCentralDB();
</script>
